<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#E8A020" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Rook Foundations | Strategy Games & Learning for Children</title>
    <meta name="description" content="Rook Foundations is a growing education project using chess and strategy games to create meaningful learning opportunities for children, building confidence, character and skills for life.">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Static mirror of the Contact page form, used only so Netlify's
         build-time form-detection bot (which does not execute JS, so it
         can't see the React-rendered form) registers "contact" as a Netlify
         Form. Field names must match src/pages/Contact.jsx exactly. The real
         submission is sent via fetch() from that component, not this form. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="parentName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="childAge" />
      <input type="text" name="learningStyle" />
      <input type="text" name="additionalNotes" />
      <input type="text" name="message" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
